<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEFC Player Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Black Eagle Football Club</h1>

    <p>Official Player Registration</p>

    <h2>Player Registration Form</h2>

    <form id="registrationForm">

        <label for="playerName">Player Name:</label>
        <input
            type="text"
            id="playerName"
            name="playerName"
            required
        >

        <br><br>

        <label for="dateOfBirth">Date of Birth:</label>
        <input
            type="date"
            id="dateOfBirth"
            name="dateOfBirth"
            required
        >

        <br><br>

        <label for="location">Location:</label>
        <input
            type="text"
            id="location"
            name="location"
            placeholder="Enter town or city"
            required
        >

        <br><br>

        <label for="position">Position:</label>
        <select id="position" name="position" required>

            <option value="">Select position</option>

            <option value="Goalkeeper">Goalkeeper</option>
            <option value="Defender">Defender</option>
            <option value="Midfielder">Midfielder</option>
            <option value="Forward">Forward</option>

        </select>

        <br><br>

        <label for="preferredFoot">Preferred Foot:</label>
        <select id="preferredFoot" name="preferredFoot" required>

            <option value="">Select foot</option>

            <option value="Right">Right</option>
            <option value="Left">Left</option>
            <option value="Both">Both</option>

        </select>

        <br><br>

        <label for="playerPhoto">Player Photo:</label>
        <input
            type="file"
            id="playerPhoto"
            name="playerPhoto"
            accept="image/*"
        >

        <br><br>

        <button type="submit">
            Register Player
        </button>

    </form>

    <script src="script.js"></script>

</body>

</html>
