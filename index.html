<!DOCTYPE html>
<html>
<head>
    <title>Black Eagle Registration</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Black Eagle Football Club</h1>

    <p>Founded and developed by Kabo Sabure</p>

    <h2>Player Registration</h2>
    
    ${photoFile ? `<img src="${URL.createObjectURL(photoFile)}" alt="Player Photo" width="150">` : ""}
    
    <p>Player ID: <span id="playerId">Generating...</span></p>

    <form>

        <label>Player Name:</label>
        <input type="text" name="playerName">

        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dateofBirth">

        <br><br>

        <label>Location:</label>
        <input type="text" name="location"             placeholder="Enter town or city">

        <br><br>

        <label>Position:</label>
        <select name="position">
            <option value="">Select position</option>
            <option value="Goalkeeper">Goalkeeper</option>
            <option value="Defender">Defender</option>
            <option value="Midfielder">Midfielder</option>
            <option value="Forwarder">Forwarder</option>
        </select>

        <br><br>

        <label>Preferred Foot:</label>
        <select name="preferredFoot">
            <option value="">Select foot</option>
            <option value="Right">Right</option>
            <option value="Left">Left</option>
            <option value="Both">Both</option>
        </select>

        <br><br>

        <br><br>

       <label>Player Photo:</label>
       <input type="file" name="playerPhoto" accept="image/*">

        <br><br>

        <button type="submit">Register Player</button>

    </form>

<div id="playerProfile"></div>

<script src="script.js"></script>

</body>
</html>
